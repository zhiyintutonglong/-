name: Build Android APK

# 手动触发: 仓库页面 -> Actions -> Build Android APK -> Run workflow
# (也支持 push 到 main 时自动触发, 需要的话取消下面 push 那一行的注释)
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev libltdl-dev
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: 编译 APK(首次约 20-40 分钟, 会自动下载 Android SDK/NDK)
        run: |
          buildozer -v android debug

      - name: 若 pygame-ce 包名不可用则回退重试
        if: failure()
        run: |
          sed -i 's/^requirements = .*/requirements = python3,pygame/' buildozer.spec
          rm -rf .buildozer
          buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dianqiuluanshe-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
