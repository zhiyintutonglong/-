name: Build Android APK

# 手动触发: 仓库页面 -> Actions -> Build Android APK -> Run workflow
# (也支持 push 到 main 时自动触发, 需要的话取消下面 push 那一行的注释)
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev libltdl-dev
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV

      # 缓存 SDK/NDK + 编译产物
      # key 换新(buildozer-py312-v1): 后续命中会直接复用 SDK/NDK 与 3.12 的 dist
      # restore-keys 保留旧前缀 buildozer-ndk-: 第一次能复用之前下载好的 SDK/NDK(省 ~15 分钟)
      # 但旧的 .buildozer 里是 Python 3.14 的 dist, 必须在编译前 rm 掉, 否则 sed 降版本不生效
      - name: 缓存 Buildozer 全局目录
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-py312-v1
          restore-keys: |
            buildozer-ndk-

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      # 注意: 不要在这里用 `sed` 改 p4a 的 python3 recipe —— buildozer 是 clone p4a 而不是
      # pip 安装, 该步骤 `import pythonforandroid` 会 ModuleNotFoundError 并让整个 job 失败。
      # Python 版本统一在 buildozer.spec 的 requirements = python3==3.12.10 里固定。

      - name: "清理旧 dist / 克隆的 p4a(关键: 否则缓存里的 3.14 被复用, == 覆盖不生效)"
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/python-for-android
          echo "已清理 .buildozer 与克隆的 p4a, 将用 Python 3.12 重新构建"

      - name: 编译 APK(首次约 20-40 分钟, 会自动下载 Android SDK/NDK)
        run: |
          buildozer -v android debug

      - name: 若首次构建异常则清理重试一次
        if: failure()
        run: |
          rm -rf .buildozer
          buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dianqiuluanshe-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
