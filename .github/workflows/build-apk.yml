name: Build Android APK

# 手动触发: 仓库页面 -> Actions -> Build Android APK -> Run workflow
# (也支持 push 到 main 时自动触发, 需要的话取消下面 push 那一行的注释)
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # 用于把首次生成的固定签名 keystore 提交回仓库

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev libltdl-dev
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV

      # 缓存 SDK/NDK(只复用 SDK/NDK 的下载, dist 每次强制重建)
      # key: buildozer-py310-v1 —— 与 buildozer.spec 里 python3==3.10.13 对应。
      # 换 Python 版本时必须同时换 key, 否则会命中旧版本的 dist 缓存。
      - name: 缓存 Buildozer 全局目录
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-py310-v1
          restore-keys: |
            buildozer-

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython pillow

      # 注意: 不要在这里用 `sed` 改 p4a 的 python3 recipe —— buildozer 是 clone p4a 而不是
      # pip 安装, 该步骤 `import pythonforandroid` 会 ModuleNotFoundError 并让整个 job 失败。
      # Python 版本统一在 buildozer.spec 的 requirements = python3==3.10.13 里固定。

      - name: "清理旧 dist / 克隆的 p4a(关键: 否则缓存里的 3.14 被复用, == 覆盖不生效)"
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/python-for-android
          echo "已清理 .buildozer 与克隆的 p4a, 将用 Python 3.10.13 重新构建"

      - name: 准备固定签名 keystore(支持覆盖安装, 无需先卸载旧版)
        run: |
          set -e
          if [ ! -f android/debug.keystore ]; then
            echo "未找到固定 keystore, 用 keytool 生成..."
            keytool -genkeypair -v \
              -keystore android/debug.keystore \
              -alias dqls -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DQLS, OU=Game, O=DQSL, L=CN, ST=CN, C=CN" \
              -storepass dqls1234 -keypass dqls1234
          else
            echo "已存在固定 keystore, 直接复用"
          fi

      - name: 编译 APK(首次约 20-40 分钟, 会自动下载 Android SDK/NDK)
        run: |
          buildozer -v android debug

      - name: 若首次构建异常则清理重试一次
        if: failure()
        run: |
          rm -rf .buildozer
          buildozer -v android debug

      - name: 提交 keystore 回仓库(仅首次生成时)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f android/debug.keystore ] && ! git ls-files --error-unmatch android/debug.keystore >/dev/null 2>&1; then
            git add android/debug.keystore
            git commit -m "chore: 添加固定签名 keystore(支持覆盖安装)"
            git push
          else
            echo "keystore 已在版本控制中, 无需提交"
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dianqiuluanshe-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
